<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free YouTube Transcript Generator | Fast & Unlimited</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #0f172a; border-radius: 8px; }
    ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
    .goog-te-gadget-simple {
      background-color: #1e293b !important;
      border: 1px solid #334155 !important;
      padding: 6px 12px !important;
      border-radius: 10px !important;
      font-size: 13px !important;
    }
    .goog-te-gadget-simple span { color: #cbd5e1 !important; }
    .goog-te-banner-frame { display: none !important; }
    body { top: 0px !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Top Bar -->
  <div class="w-full max-w-4xl flex justify-between items-center py-2 mb-4">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-600/30">
        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/>
        </svg>
      </div>
      <span class="text-sm font-bold tracking-wide uppercase text-slate-300">YT Transcript Tool</span>
    </div>
    <div id="google_translate_element"></div>
  </div>

  <!-- Main Content -->
  <main class="max-w-4xl w-full my-auto flex flex-col items-center">
    
    <header class="text-center mb-8 max-w-2xl">
      <h1 class="text-3xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-sky-300 to-cyan-400 mb-3 tracking-tight leading-tight">
        Free YouTube Transcript Generator
      </h1>
      <p class="text-slate-400 text-base sm:text-lg leading-relaxed">
        Extract transcripts and captions from any YouTube video instantly for free.
      </p>
    </header>

    <div id="ad-top" class="w-full max-w-3xl h-20 bg-slate-900/60 border border-dashed border-slate-800 rounded-2xl flex items-center justify-center text-xs text-slate-500 mb-6">
      [ Advertisement Space ]
    </div>

    <div class="w-full max-w-3xl bg-slate-900/90 border border-slate-800 p-5 sm:p-8 rounded-3xl shadow-2xl mb-6">
      
      <div class="flex flex-col sm:flex-row gap-3">
        <input type="text" id="youtubeUrl" 
               placeholder="Paste YouTube link here (e.g. https://www.youtube.com/watch?v=...)" 
               class="w-full px-4 py-4 rounded-2xl bg-slate-950 text-white border border-slate-700 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition text-base placeholder:text-slate-500">
        
        <button onclick="handleFetchTranscript()" id="submitBtn"
                class="bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-bold px-8 py-4 rounded-2xl transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30 whitespace-nowrap text-base cursor-pointer">
          <span>Get Transcript</span>
        </button>
      </div>

      <div id="loading" class="hidden text-center text-indigo-400 py-8 animate-pulse font-semibold text-base flex flex-col items-center justify-center gap-3">
        <div class="w-10 h-10 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
        <span id="loadingStatus">Fetching video transcript from YouTube...</span>
      </div>

      <div id="errorBox" class="hidden mt-6 p-4 rounded-2xl bg-rose-950/80 border border-rose-800 text-rose-200 text-sm font-medium flex items-center gap-3">
        <svg class="w-5 h-5 flex-shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span id="errorMessage"></span>
      </div>

      <div id="resultBox" class="hidden mt-6">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4 mb-4">
          <div class="flex gap-1.5 bg-slate-950 p-1.5 rounded-xl text-xs sm:text-sm font-bold border border-slate-800">
            <button id="tabClean" onclick="switchTab('clean')" class="px-4 py-2 rounded-lg bg-indigo-600 text-white transition shadow-sm">
              Plain Text
            </button>
            <button id="tabTime" onclick="switchTab('time')" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition">
              With Timestamps
            </button>
          </div>

          <div class="flex gap-2">
            <button onclick="copyText()" id="copyBtn" class="text-xs sm:text-sm bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 px-4 py-2 rounded-xl text-slate-200 transition font-semibold flex items-center gap-1.5 cursor-pointer">
              <span>📋 Copy Text</span>
            </button>
            <button onclick="downloadText()" class="text-xs sm:text-sm bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white px-4 py-2 rounded-xl transition font-semibold flex items-center gap-1.5 shadow-lg shadow-emerald-600/20 cursor-pointer">
              <span>⬇️ Download .txt</span>
            </button>
          </div>
        </div>

        <div id="transcriptClean" dir="auto"
             class="p-5 sm:p-6 bg-slate-950 rounded-2xl max-h-[460px] overflow-y-auto text-slate-200 leading-relaxed text-base sm:text-lg whitespace-pre-wrap border border-slate-800 font-normal"></div>
        
        <div id="transcriptTime" dir="auto"
             class="hidden p-5 sm:p-6 bg-slate-950 rounded-2xl max-h-[460px] overflow-y-auto text-slate-200 leading-relaxed text-sm sm:text-base whitespace-pre-wrap border border-slate-800 font-mono"></div>
      </div>
    </div>

    <div id="ad-bottom" class="w-full max-w-3xl h-24 bg-slate-900/60 border border-dashed border-slate-800 rounded-2xl flex items-center justify-center text-xs text-slate-500 mb-6">
      [ Advertisement Space ]
    </div>

  </main>

  <footer class="text-center text-xs sm:text-sm text-slate-500 py-4">
    &copy; 2026 - Free YouTube Transcript Tool. All Rights Reserved.
  </footer>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <script>
    let globalTranscript = [];
    let globalFullText = "";

    document.getElementById("youtubeUrl").addEventListener("keypress", function(e) {
      if (e.key === "Enter") handleFetchTranscript();
    });

    function extractVideoId(url) {
      if (!url) return null;
      url = url.trim();
      if (url.length === 11 && /^[0-9A-Za-z_-]{11}$/.test(url)) return url;
      const patterns = [
        /youtu\.be\/([0-9A-Za-z_-]{11})/,
        /[?&]v=([0-9A-Za-z_-]{11})/,
        /(?:shorts|embed|v)\/([0-9A-Za-z_-]{11})/
      ];
      for (const p of patterns) {
        const m = url.match(p);
        if (m) return m[1];
      }
      return null;
    }

    async function fetchFromClientSide(videoId) {
      // Direct client-side fetch bypassing Cloud IP block
      const proxies = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent('https://www.youtube.com/watch?v=' + videoId)}`,
        `https://corsproxy.io/?${encodeURIComponent('https://www.youtube.com/watch?v=' + videoId)}`
      ];

      for (const proxyUrl of proxies) {
        try {
          const res = await fetch(proxyUrl);
          const html = await res.text();
          const match = html.match(/"captionTracks":\s*(\[.*?\])/);
          if (match) {
            const tracks = JSON.parse(match[1]);
            if (tracks && tracks.length > 0) {
              let track = tracks.find(t => t.languageCode?.startsWith('ar')) ||
                          tracks.find(t => t.languageCode?.startsWith('en')) ||
                          tracks[0];

              const subUrl = track.baseUrl + '&fmt=json3';
              const subRes = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(subUrl)}`);
              const subData = await subRes.json();
              
              if (subData && subData.events) {
                const transcript = [];
                for (const ev of subData.events) {
                  if (ev.segs) {
                    const text = ev.segs.map(s => s.utf8 || '').join('').trim();
                    if (text) {
                      transcript.push({
                        text: text,
                        start: Math.round((ev.tStartMs || 0) / 10) / 100,
                        duration: Math.round((ev.dDurationMs || 0) / 10) / 100
                      });
                    }
                  }
                }
                if (transcript.length > 0) {
                  return {
                    status: 'success',
                    video_id: videoId,
                    full_text: transcript.map(t => t.text).join(' '),
                    transcript: transcript
                  };
                }
              }
            }
          }
        } catch (e) {
          continue;
        }
      }
      return null;
    }

    async function handleFetchTranscript() {
      const urlInput = document.getElementById('youtubeUrl').value.trim();
      const loading = document.getElementById('loading');
      const resultBox = document.getElementById('resultBox');
      const errorBox = document.getElementById('errorBox');
      const errorMessage = document.getElementById('errorMessage');
      const submitBtn = document.getElementById('submitBtn');

      errorBox.classList.add('hidden');

      const videoId = extractVideoId(urlInput);
      if (!videoId) {
        errorMessage.innerText = 'Please enter a valid YouTube video URL.';
        errorBox.classList.remove('hidden');
        return;
      }

      loading.classList.remove('hidden');
      resultBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50', 'pointer-events-none');

      try {
        // Attempt 1: Call Backend Server
        let data = null;
        try {
          const response = await fetch(`/api/transcript?url=${encodeURIComponent(urlInput)}`);
          if (response.ok) {
            data = await response.json();
          }
        } catch (e) {}

        // Attempt 2: If Backend is blocked by Cloud IP, use Client-Side bypass
        if (!data || !data.transcript || data.transcript.length === 0) {
          data = await fetchFromClientSide(videoId);
        }

        if (data && data.transcript && data.transcript.length > 0) {
          globalFullText = data.full_text;
          globalTranscript = data.transcript;

          document.getElementById('transcriptClean').innerText = data.full_text;

          const timeFormatted = data.transcript.map(item => {
            const min = Math.floor(item.start / 60).toString().padStart(2, '0');
            const sec = Math.floor(item.start % 60).toString().padStart(2, '0');
            return `[${min}:${sec}] ${item.text}`;
          }).join('\n');

          document.getElementById('transcriptTime').innerText = timeFormatted;
          switchTab('clean');
          resultBox.classList.remove('hidden');
        } else {
          errorMessage.innerText = 'Could not retrieve a transcript for this video. Please ensure the video has closed captions/subtitles available.';
          errorBox.classList.remove('hidden');
        }
      } catch (err) {
        errorMessage.innerText = 'An error occurred while fetching the transcript. Please try again.';
        errorBox.classList.remove('hidden');
      } finally {
        loading.classList.add('hidden');
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50', 'pointer-events-none');
      }
    }

    function switchTab(type) {
      const cleanBox = document.getElementById('transcriptClean');
      const timeBox = document.getElementById('transcriptTime');
      const tabClean = document.getElementById('tabClean');
      const tabTime = document.getElementById('tabTime');

      if (type === 'clean') {
        cleanBox.classList.remove('hidden');
        timeBox.classList.add('hidden');
        tabClean.className = "px-4 py-2 rounded-lg bg-indigo-600 text-white transition shadow-sm";
        tabTime.className = "px-4 py-2 rounded-lg text-slate-400 hover:text-white transition";
      } else {
        cleanBox.classList.add('hidden');
        timeBox.classList.remove('hidden');
        tabTime.className = "px-4 py-2 rounded-lg bg-indigo-600 text-white transition shadow-sm";
        tabClean.className = "px-4 py-2 rounded-lg text-slate-400 hover:text-white transition";
      }
    }

    function copyText() {
      const isClean = !document.getElementById('transcriptClean').classList.contains('hidden');
      const textToCopy = isClean ? document.getElementById('transcriptClean').innerText : document.getElementById('transcriptTime').innerText;
      navigator.clipboard.writeText(textToCopy);
      const copyBtn = document.getElementById('copyBtn');
      const oldHtml = copyBtn.innerHTML;
      copyBtn.innerHTML = '<span>✅ Copied!</span>';
      setTimeout(() => copyBtn.innerHTML = oldHtml, 2000);
    }

    function downloadText() {
      const isClean = !document.getElementById('transcriptClean').classList.contains('hidden');
      const textToDownload = isClean ? document.getElementById('transcriptClean').innerText : document.getElementById('transcriptTime').innerText;
      const blob = new Blob([textToDownload], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'transcript.txt';
      a.click();
    }
  </script>
</body>
</html>
